name: Build Spider Link APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'        # Java 11 + buildozer 1.4 is proven combo
          distribution: 'temurin'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'     # Python 3.9 is most stable for buildozer

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.4.0 cython==0.29.33
          pip install paho-mqtt pycryptodome

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Pre-accept Android licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4408943b284a20b2b669f296802a\nd56f5187479451eabf01fb78af6dfcb131a6481e" \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" \
            > ~/.buildozer/android/platform/android-sdk/licenses/google-gdk-license
          echo "✅ Licenses written"

      - name: Pre-download NDK r25b
        run: |
          NDK_PATH="$HOME/.buildozer/android/platform/android-ndk-r25b"
          if [ ! -d "$NDK_PATH" ]; then
            echo "Downloading NDK r25b..."
            mkdir -p "$HOME/.buildozer/android/platform"
            cd "$HOME/.buildozer/android/platform"
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
            rm android-ndk-r25b-linux.zip
            echo "✅ NDK ready"
          else
            echo "✅ NDK cached"
          fi

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderLink-APK
          path: bin/*.apk
          if-no-files-found: error
