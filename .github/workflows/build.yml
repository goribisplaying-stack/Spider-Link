name: Build Spider Link APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.1"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v3

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee /tmp/buildozer_full.txt

      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== LAST 60 LINES ==="
          tail -60 /tmp/buildozer_full.txt | cut -c1-300
          echo "=== LAST TRACEBACK / FAILURE ==="
          grep -n -E "Traceback|Command failed|No matching distribution|BUILD FAILED|What went wrong" /tmp/buildozer_full.txt | tail -10 | cut -c1-300
      - uses: actions/upload-artifact@v4
        with:
          name: SpiderLink-APK
          path: bin/*.apk
          if-no-files-found: error
